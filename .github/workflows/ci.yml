name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest unit + integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: echonotes_test
          POSTGRES_PASSWORD: echonotes_test
          POSTGRES_DB: echonotes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U echonotes_test -d echonotes_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      TRANSCRIBER_PROVIDER: fake
      # Throwaway CI database (not a secret). Integration tests skip when this is unset.
      TEST_DATABASE_URL: postgresql+psycopg://echonotes_test:echonotes_test@localhost:5432/echonotes_test
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv (with cache)
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Tests (unit + integration on Postgres)
        run: uv run pytest -q

  frontend:
    name: Frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node (with npm cache)
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker (build image + boot with compose + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push, GitHub Actions layer cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: echonotes:local
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=echonotes-image
          cache-to: type=gha,scope=echonotes-image,mode=max

      - name: Image runs as non-root and has no Node toolchain or uv
        run: |
          set -euo pipefail
          uid=$(docker run --rm echonotes:local id -u)
          test "$uid" != "0"
          docker run --rm echonotes:local sh -c '! command -v node && ! command -v npm && ! command -v uv'
          docker image ls echonotes:local --format 'image size: {{.Size}}'

      - name: Boot app + Postgres with compose (no .env, fake transcriber)
        run: docker compose up -d --no-build --wait --wait-timeout 120

      # Key journey (#24): health, SPA, project -> audio -> transcript -> screenshot -> ZIP,
      # then deletes the project. Fake transcriber, never Groq.
      - name: Smoke test (scripts/smoke.sh)
        run: scripts/smoke.sh http://localhost:8000

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
