# Alembic configuration. The database URL is NOT set here: alembic/env.py reads
# DATABASE_URL through app.config.get_settings().
# Logging is NOT configured here either: alembic/env.py uses the app's JSON formatter
# (app/logging.py), so migration logs have the same format as the app logs (#41).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
