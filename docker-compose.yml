# Whole system with one command (#22): `docker compose up --build` -> http://localhost:8000
# Works on a fresh clone WITHOUT .env (fake transcriber, local Postgres credentials).
# `.env` is optional: it can switch TRANSCRIBER_PROVIDER=groq and set GROQ_API_KEY, or set
# GEMINI_API_KEY for real AI summaries (without it summaries use the offline `fake` provider).
# Data lives in the named volume `pgdata`: kept by `docker compose down`, wiped by `down -v`.
#
# Local observability (#30): `make obs-up` adds the `observability` profile (service `lgtm`:
# OTel Collector + Prometheus + Loki + Tempo + Grafana in one container) and points the app's
# OTLP exporter at it. Plain `docker compose up --build` starts only db + app, without telemetry.
# Host ports: APP_PORT (default 8000) and GRAFANA_PORT (default 3000).
name: echonotes

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-echonotes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-echonotes}
      POSTGRES_DB: ${POSTGRES_DB:-echonotes}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port: only the app talks to the database (avoids clashes with a local Postgres).
    healthcheck:
      # -h 127.0.0.1 (TCP), not the Unix socket: on a fresh volume the image's temporary init
      # server listens on the socket only, so a socket check passes too early and the app's
      # migration then gets "connection refused" over TCP and the app exits.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the image as ENV GIT_SHA and shown as `commit` in /api/health, e.g.
        # `GIT_SHA=$(git rev-parse HEAD) docker compose up --build`
        GIT_SHA: ${GIT_SHA:-unknown}
    # APP_IMAGE lets a parallel stack (e.g. the incident demo) build its own tag without replacing
    # the image of the default `echonotes` project. CI uses the default.
    image: ${APP_IMAGE:-echonotes:local}
    depends_on:
      db:
        condition: service_healthy
      # Only with the observability profile: start exporting once the collector is ready.
      lgtm:
        condition: service_healthy
        required: false
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    # `environment` wins over `env_file`, so a localhost DATABASE_URL or an empty STATIC_DIR
    # in .env (meant for running uvicorn on the host) cannot break the container.
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-echonotes}:${POSTGRES_PASSWORD:-echonotes}@db:5432/${POSTGRES_DB:-echonotes}
      STATIC_DIR: /app/static
      PORT: "8000"
      TRANSCRIBER_PROVIDER: ${TRANSCRIBER_PROVIDER:-fake}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # AI project summary (US-22). Empty SUMMARIZER_PROVIDER = auto: gemini when GEMINI_API_KEY
      # is set (shell or .env), otherwise the offline `fake` (no .env, CI). An empty key is valid.
      # The other defaults repeat the app's own (backend/app/config.py): never pass an empty
      # string for a model or a number, it would override the app default or fail validation.
      SUMMARIZER_PROVIDER: ${SUMMARIZER_PROVIDER:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      # No colon on purpose: an explicit empty GEMINI_FALLBACK_MODEL= disables the fallback.
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL-gemini-3.5-flash-lite}
      GEMINI_PRIMARY_TIMEOUT_SECONDS: ${GEMINI_PRIMARY_TIMEOUT_SECONDS:-40}
      GROQ_SUMMARY_MODEL: ${GROQ_SUMMARY_MODEL:-openai/gpt-oss-120b}
      SUMMARY_TIMEOUT_SECONDS: ${SUMMARY_TIMEOUT_SECONDS:-90}
      SUMMARY_MAX_CHARS: ${SUMMARY_MAX_CHARS:-60000}
      SUMMARY_MAX_IMAGES: ${SUMMARY_MAX_IMAGES:-8}
      SUMMARY_IMAGE_MAX_PX: ${SUMMARY_IMAGE_MAX_PX:-1280}
      SUMMARY_MAX_IMAGE_BYTES: ${SUMMARY_MAX_IMAGE_BYTES:-4194304}
      # Telemetry is off unless `make obs-up` sets OBS_OTLP_ENDPOINT=http://lgtm:4318. A dedicated
      # variable (not OTEL_EXPORTER_OTLP_ENDPOINT) so a host-dev value in .env cannot leak in here.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OBS_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: echonotes-api
      # No GIT_SHA here on purpose: the image's baked `ENV GIT_SHA` (from the build arg) must win,
      # also for `up --no-build` of a CI-built image (#47).

  # Profile `observability` only (`make obs-up`). Grafana on GRAFANA_PORT (admin/admin, local
  # only); Prometheus, Loki and Tempo stay inside the container and are reached through Grafana.
  lgtm:
    image: grafana/otel-lgtm:0.40.0
    profiles: [observability]
    ports:
      # Loopback only: a local dev tool with a well-known password must not be reachable from
      # the network. OTLP (4317/4318) is not published; the app sends to lgtm:4318 inside compose.
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      # Local-only credentials (documented in docs/observability.md), not a secret.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # The image enables anonymous Admin access by default; require the login instead.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Grafana's external URL: dashboardURL/panelURL in alert notifications, {{ externalURL }}.
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3000}
      # Contact point of the provisioned alert (observability/alerts.yaml): the on-call responder.
      ONCALL_WEBHOOK_URL: ${ONCALL_WEBHOOK_URL:-http://host.docker.internal:9095/alert}
      # Set ENABLE_LOGS_GRAFANA=true to see Grafana's own log (e.g. provisioning errors).
      ENABLE_LOGS_GRAFANA: ${ENABLE_LOGS_GRAFANA:-false}
    extra_hosts:
      # host.docker.internal also on Linux (Docker Desktop already provides it).
      - "host.docker.internal:host-gateway"
    # Provisioning from observability/ (file mounts; the image's other defaults stay).
    volumes:
      - ./observability/provisioning/datasources/datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml:ro
      - ./observability/provisioning/dashboards/echonotes.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/echonotes.yaml:ro
      - ./observability/dashboard.json:/otel-lgtm/echonotes/dashboard.json:ro
      - ./observability/alerts.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/echonotes-alerts.yaml:ro
    healthcheck:
      # Grafana up and the OTLP receiver ready (the image's own healthcheck runs only every 30 s).
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null && curl -fsS http://127.0.0.1:13133/ready >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
