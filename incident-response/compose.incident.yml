# Compose override used ONLY by the on-call demo (test-incident.sh) and the responder rebuild.
#
#   docker compose -p echonotes-incident -f docker-compose.yml \
#     -f incident-response/compose.incident.yml --profile observability up -d --build
#
# Why it exists: the base file tags the app image `echonotes:local`, the tag of the user's own
# `echonotes` stack. Building the chaos (buggy) image under that tag would silently replace the
# user's image. This override gives the incident stack its own tag and pins the host port, so the
# demo can never disturb the `echonotes` project on port 8000.
services:
  app:
    image: echonotes-incident:${INCIDENT_IMAGE_TAG:-latest}
    ports: !override
      - "${APP_PORT:-8001}:8000"
